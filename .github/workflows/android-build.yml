
name: Build My Notes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            echo "Upload your project ZIP to the main repository page."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's|/app/build.gradle||')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: app/build.gradle was not found in the ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .
          test -f app/build.gradle
          test -f settings.gradle
          test -f build.gradle

      - name: Repair Gradle and color resources
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          content = gradle.read_text()
          content = content.replace(r"\n    implementation", "\n    implementation")
          gradle.write_text(content)

          colors = Path("app/src/main/res/values/colors.xml")
          colors.parent.mkdir(parents=True, exist_ok=True)
          colors.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6D83F7</color>
              <color name="purple_700">#FF4B5FC7</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          """)
          print("Gradle and colors.xml checked.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Notes-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
